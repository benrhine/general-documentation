name: Deploy AsciiDoc with GitHub Pages dependencies preinstalled

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Get Git Commiter Name and Email
        run: | 
          COMMITER_NAME=$(git log -1 --pretty=%cn)
          COMMITER_EMAIL=$(git log -1 --pretty=%ce)
          echo "COMMITER_NAME=$COMMITER_NAME" >> $GITHUB_ENV
          echo "COMMITER_EMAIL=COMMITER_EMAIL" >> $GITHUB_ENV
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Setup JDK 24
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '24'
          cache: 'gradle'
#      - name: Setup Gradle
#        uses: gradle/actions/setup-gradle@v4
      - name: Grant execute permission for Gradle
        run: chmod +x gradlew
      - name: Get current date and time
        id: current-time
        uses: Kaven-Universe/github-action-current-date-time@v1
        with:
          format: "YYYY-MM-DD HH:mm:ss"
      - name: Get build number
        run: |
          echo "Current Build Number: ${{github.run_number}} name: Use Build Number in another step"
      - name: Build with AsciiDoc
        run: ./gradlew docGeneral
        env:
          GIT_USER_NAME: ${{env.COMMITER_NAME}}
          GIT_USER_EMAIL: ${{env.COMMITER_EMAIL}}
          GIT_COMMIT_MSG: ${{github.event.head_commit.message}}
          GIT_BUILD_NUM: ${{github.run_number}}
#        with:
#          source: ./
#          destination: ./_site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/docs

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
